version: '3.8'

services:
  reverse-proxy:
    image: ecommerce-nginx:local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/site.crt:/etc/nginx/certs/site.crt:ro
      - ./certs/site.key:/etc/nginx/certs/site.key:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - ecommerce_net

  frontend:
    image: eliasf1912/ecommerce-frontend:latest
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
    environment:
      NODE_ENV: production
      VITE_PRODUCT_SERVICE_URL: http://product-service:3000
      VITE_AUTH_SERVICE_URL: http://auth-service:3001
      VITE_ORDER_SERVICE_URL: http://order-service:3002
    ports:
      - "8080:8080"
    networks:
      - ecommerce_net

  auth-service:
    image: eliasf1912/ecommerce-auth:latest
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/auth
    command: sh -c "export JWT_SECRET=$$(cat /run/secrets/jwt_secret) && node src/app.js"
    secrets:
      - jwt_secret
    networks:
      - ecommerce_net

  product-service:
    image: eliasf1912/ecommerce-product:latest
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/ecommerce
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ecommerce_net

  order-service:
    image: eliasf1912/ecommerce-order:latest
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/orders
      VITE_PRODUCT_SERVICE_URL: http://product-service:3000
    command: sh -c "export JWT_SECRET=$$(cat /run/secrets/jwt_secret) && node src/app.js"
    secrets:
      - jwt_secret
    networks:
      - ecommerce_net

  mongodb:
    image: mongo:4.4
    deploy:
      placement:
        constraints:
          - node.role == manager
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    networks:
      - ecommerce_net

volumes:
  mongodb_data:
    driver: local

networks:
  ecommerce_net:
    driver: overlay

secrets:
  jwt_secret:
    external: true